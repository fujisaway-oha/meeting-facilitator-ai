services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_PASSCODE: "${APP_PASSCODE:-1234}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-change-me-in-production-meeting-ai}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      VOICEVOX_BASE_URL: "${VOICEVOX_BASE_URL:-http://voicevox:50021}"
      VOICEVOX_SPEAKER_ID: "${VOICEVOX_SPEAKER_ID:-3}"
      WHISPER_MODEL: "${WHISPER_MODEL:-small}"
      WHISPER_DEVICE: "${WHISPER_DEVICE:-cpu}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      DATA_DIR: "/app/data"
      CONFIG_PATH: "/app/config/models.yaml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./static/videos:/app/videos:ro
    depends_on:
      - voicevox
    restart: unless-stopped

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    expose:
      - "50021"
    restart: unless-stopped
